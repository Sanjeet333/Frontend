<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="logo">Kanban <span>Board</span></div>
            <div class="nav-actions">
                <button id="toggle-modal" class="primary-btn">+ Add New Task</button>
            </div>
        </nav>

        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right count-badge">0</div>
                </div>
                </div>
            
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right count-badge">0</div>
                </div>
            </div>
            
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right count-badge">0</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal">
        <div class="bg"></div>
        <div class="center modal-card">
            <h3>Create New Task</h3>
            <input id="task-title" type="text" placeholder="Task Title" autocomplete="off">
            <textarea id="task-desc" placeholder="Task Description" rows="4"></textarea>
            <button id="add-new-task" class="submit-task-btn">Add Task</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
